# Registry of the controllers (REPO_STRUCTURE.md, section 4.2). Scripts receive only a name.
#   type  onnx: a policy file run with onnxruntime
#   hf    [repo, file] on Hugging Face: downloaded once to models/base/<name>/
#   path  alternatively, a file relative to models/

alpha_walking:
  type: onnx
  hf: [pollen-robotics/microduck-policies, alpha_walking.onnx]

rough_walk_g:
  type: onnx
  hf: [RemiFabre/microduck-rough-walk-g, policy.onnx]
