# The controllers by name (REPO_STRUCTURE.md, section 3). Scripts receive only the name.
#   type  onnx: a policy file run with onnxruntime
#   hf    [repo, file] on Hugging Face, downloaded once to models/<name>/
#   path  or a file relative to models/
#   type  sae: {base, run}: `base` with one activation replaced by the SAE reconstruction of runs/<run>/sae.pt
#   type  adapter: {base, run}: `base` with the steering vectors of runs/<run>/adapter.pt (train.py distill)
#   checkpoint  [repo, file] of the full rsl_rl training checkpoint (actor, critic, normalizers, action std,
#               optimizer) on Hugging Face, downloaded once to models/<name>/: the start of a PPO fine-tuning

alpha_walking:
  type: onnx
  hf: [pollen-robotics/microduck-policies, alpha_walking.onnx]
  # W&B run pollen-robotics/mjlab_microduck/441tzs6d, iteration 3750, task Mjlab-Velocity2-Rough-Backlash-MicroDuck,
  # microduck_rl commit 2f1f76bc6; its actor gives the actions of alpha_walking.onnx (max difference 4e-6)
  checkpoint: [pollen-robotics/microduck-training, bundles/velocity2/441tzs6d_3750/model_3750.pt]

rough_walk_g:
  type: onnx
  hf: [RemiFabre/microduck-rough-walk-g, policy.onnx]

# specialists of phase 2: alpha_walking fine-tuned with PPO on one family of configs/training.yaml (directional:
# only uphill or only downhill on face_slope), uploaded to Hugging Face by scripts/train.py
slope_up-20261028-0021:
  type: onnx
  hf: [mpreda/slope_up-20261028-0021, 20261028-0021_train_ppo_slope_up.onnx]

# the same training at iteration 400 (scripts/convert.py checkpoint), to compare with the last checkpoint (999)
slope_up-20261028-0021-it400:
  type: onnx
  run: 20261028-1912_convert_20261028-0021_train_ppo_slope_up_it400

slope_down-20261027-2240:
  type: onnx
  hf: [mpreda/slope_down-20261027-2240, 20261027-2240_train_ppo_slope_down.onnx]

# the slope_up checkpoint chosen by scripts/choose_checkpoint.py (iteration 300), the one distilled in phase 3
slope_up-20261028-0021-it300:
  type: onnx
  run: 20261029-1846_choose_20261028-0021_train_ppo_slope_up

slope_down-20261027-2240-it400:
  type: onnx
  hf: [mpreda/slope_down-20261027-2240-it400, slope_down-20261027-2240-it400.onnx]


alpha_walking+sae_h2:       # first failed experiment, during evaluation was different than alpha_walking
  {type: sae, 
  base: alpha_walking, 
  run: 20261102-1819_train_sae_h2}

alpha_walking+sae_h2_k32: 
  {type: sae, 
  base: alpha_walking, 
  run: 20261103-1806_train_sae_h2}

