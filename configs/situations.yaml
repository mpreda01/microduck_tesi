# Situations of the benchmark (REPO_STRUCTURE.md, section 3): phase 1 of notebooks/fase_1.ipynb.
#
# Each block below becomes one situation per combination of the lists under `sweep`
# (no sweep: one situation). `name` is a template filled with the block's values.
# To change the slopes, the frictions, the payloads... edit the lists.
#
# Keys of a block:
#   group         benchmark group: the phase 1 criterion counts the groups worse than `reference`
#   terrain       flat | grid | stairs | rubble | waves | slope | face_slope | strip
#     grid, stairs, rubble   height_cm  (rubble: +- height_cm)
#     stairs                 direction: down (from the top) | up (from the edge)
#     waves                  amplitude_cm (peak-to-peak = 2 x amplitude), num_waves along the patch
#     slope                  deg: the training pyramid (mjlab, with creases), walked down from the top
#     face_slope             deg, direction: downhill | uphill, on a pyramid with planar faces
#     strip                  deg, direction: down | up; flat_before_m -> slope_m -> flat_after_m, walked towards +x
#   friction      sliding coefficient set on the feet AND the floor (training range 0.7-1.3)
#   mass_pct      payload welded to the trunk, in % of the robot mass ...
#   offset        ... placed at the robot's centre of mass + payload_offsets_m[offset]
#   event         friction | payload: change at event_t_s (friction drops to friction_after, or the payload appears)
#   episode_s     episode length, if different from configs/eval.yaml

payload_offsets_m:        # from the robot's centre of mass, trunk frame: x forward, y left, z up
  com: [0, 0, 0]          # mass added, centre of mass unchanged
  front: [0.05, 0, 0]
  back: [-0.05, 0, 0]
  side: [0, 0.05, 0]
  up: [0, 0, 0.08]

situations:
  - name: flat
    group: reference
    terrain: flat

  # ---- uneven ground ----
  # - name: grid_{height_cm}cm
  #   group: uneven
  #   terrain: grid
  #   sweep: {height_cm: [0.3, 0.6, 0.9, 1.2, 1.5]}

  # - name: rubble_{height_cm}cm
  #   group: uneven
  #   terrain: rubble
  #   sweep: {height_cm: [1, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9]}

  # - name: waves_{amplitude_cm}cm
  #   group: uneven
  #   terrain: waves
  #   num_waves: 8
  #   sweep: {amplitude_cm: [0.5, 1.0, 1.5, 2.0]}

  # ---- low steps ----
  # - name: stairs_{direction}_{height_cm}cm
  #   group: steps
  #   terrain: stairs
  #   sweep: {height_cm: [1.0, 1.25, 1.5, 1.75], direction: [down, up]}

  # ---- slopes ----
  - name: pyramid_{deg}deg
    group: slope
    terrain: slope
    sweep: {deg: [3, 4, 5, 5.5, 6, 6.5, 7, 8, 9]}

  - name: face_{deg}deg_{direction}
    group: slope
    terrain: face_slope
    sweep: {deg: [3, 4, 5, 5.5, 6, 6.5, 7, 8, 9], direction: [downhill, uphill]}

  # ---- slippery floor ----
  # - name: friction_{friction}
  #   group: friction
  #   terrain: flat
  #   sweep: {friction: [0.175, 0.15, 0.125]}

  # # ---- payload ----
  # - name: payload_{mass_pct}pct_{offset}
  #   group: payload
  #   terrain: flat
  #   offset: com
  #   sweep: {mass_pct: [40, 50], }

  # - name: payload_{mass_pct}pct_{offset}
  #   group: payload
  #   terrain: flat
  #   sweep: {mass_pct: [40, 50], offset: [front, back, side, up]}

  # ---- transitions during the episode ----
  # - name: trans_{direction}_{deg}deg
  #   group: transition
  #   terrain: strip
  #   flat_before_m: 1.5
  #   slope_m: 1.5
  #   flat_after_m: 4.0
  #   episode_s: 30.0
  #   sweep: {deg: [5, 10], direction: [down, up]}

  # - name: trans_friction_{friction_after}
  #   group: transition
  #   terrain: flat
  #   event: friction
  #   event_t_s: 5.0
  #   sweep: {friction_after: [0.3, 0.15]}

  # - name: trans_payload_{mass_pct}pct_{offset}
  #   group: transition
  #   terrain: flat
  #   mass_pct: 30
  #   event: payload
  #   event_t_s: 5.0
  #   sweep: {offset: [com, back]}

# Groups of situations evaluated together; `all` (every situation) is built in.
# A suite is a list of names, or {groups: [...]}.
suites:
  flat: [flat]
  fixed: {groups: [reference, uneven, steps, slope, friction, payload]}
  transitions: {groups: [transition]}
