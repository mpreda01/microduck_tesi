# Situations of the benchmark (REPO_STRUCTURE.md, section 4.1): the single source of truth used by
# every evaluation. The 68 conditions of phase 1, as in notebooks/fase_1.ipynb.
#
# Fields of an entry:
#   name       unique identifier, used in file names and in the `situation` column of the results
#   group      benchmark group; the phase 1 criterion counts the groups worse than `reference`
#   terrain    kind: flat | grid (height_cm) | stairs (height_cm, direction down from the top / up from
#              the edge) | rubble (height_cm) | waves (amplitude_cm, peak-to-peak = 2 x amplitude,
#              num_waves) | slope (deg, training pyramid walked down from the top) | face_slope (deg,
#              direction downhill / uphill, planar faces; size_m, start_m) | strip (segments
#              [length_m, slope_deg] walked towards +x; width_m, start_m)
#   friction   sliding coefficient set on the feet AND every terrain geom (optional)
#   payload    {mass_frac: fraction of the robot mass, offset_m: [x fwd, y left, z up] from the robot's
#              centre of mass in the trunk frame} (optional)
#   event      {type: friction | payload, t_s, value}: change during the episode (optional)
#   episode_s  episode length, overrides the default of configs/sim.yaml (optional)
#
# The position of an entry in this list seeds its terrain and its episodes (seed + index): add new
# situations at the END, so that the episodes of the existing ones do not change.

situations:

  # --- Reference
  - {name: flat, group: reference, terrain: {kind: flat}}

  # --- Uneven ground (phase 0 grids and rubble; waves of plan section 4.6)
  - {name: grid_0.3cm, group: uneven, terrain: {kind: grid, height_cm: 0.3}}
  - {name: grid_0.6cm, group: uneven, terrain: {kind: grid, height_cm: 0.6}}
  - {name: grid_0.9cm, group: uneven, terrain: {kind: grid, height_cm: 0.9}}
  - {name: grid_1.2cm, group: uneven, terrain: {kind: grid, height_cm: 1.2}}
  - {name: grid_1.5cm, group: uneven, terrain: {kind: grid, height_cm: 1.5}}
  - {name: rubble_0.2cm, group: uneven, terrain: {kind: rubble, height_cm: 0.2}}
  - {name: rubble_0.75cm, group: uneven, terrain: {kind: rubble, height_cm: 0.75}}
  - {name: rubble_1.3cm, group: uneven, terrain: {kind: rubble, height_cm: 1.3}}
  - {name: rubble_1.9cm, group: uneven, terrain: {kind: rubble, height_cm: 1.9}}
  - {name: rubble_2.5cm, group: uneven, terrain: {kind: rubble, height_cm: 2.5}}
  - {name: waves_0.5cm, group: uneven, terrain: {kind: waves, amplitude_cm: 0.5, num_waves: 8}}
  - {name: waves_1.0cm, group: uneven, terrain: {kind: waves, amplitude_cm: 1.0, num_waves: 8}}
  - {name: waves_1.5cm, group: uneven, terrain: {kind: waves, amplitude_cm: 1.5, num_waves: 8}}
  - {name: waves_2.0cm, group: uneven, terrain: {kind: waves, amplitude_cm: 2.0, num_waves: 8}}

  # --- Low steps, walked down from the top or up from the edge
  - {name: stairs_down_1.0cm, group: steps, terrain: {kind: stairs, height_cm: 1.0, direction: down}}
  - {name: stairs_up_1.0cm, group: steps, terrain: {kind: stairs, height_cm: 1.0, direction: up}}
  - {name: stairs_down_1.5cm, group: steps, terrain: {kind: stairs, height_cm: 1.5, direction: down}}
  - {name: stairs_up_1.5cm, group: steps, terrain: {kind: stairs, height_cm: 1.5, direction: up}}
  - {name: stairs_down_2.0cm, group: steps, terrain: {kind: stairs, height_cm: 2.0, direction: down}}
  - {name: stairs_up_2.0cm, group: steps, terrain: {kind: stairs, height_cm: 2.0, direction: up}}
  - {name: stairs_down_2.5cm, group: steps, terrain: {kind: stairs, height_cm: 2.5, direction: down}}
  - {name: stairs_up_2.5cm, group: steps, terrain: {kind: stairs, height_cm: 2.5, direction: up}}
  - {name: stairs_down_3.0cm, group: steps, terrain: {kind: stairs, height_cm: 3.0, direction: down}}
  - {name: stairs_up_3.0cm, group: steps, terrain: {kind: stairs, height_cm: 3.0, direction: up}}

  # --- Slopes: training pyramid from the top (phase 0) and planar-face pyramid uphill / downhill
  - {name: pyramid_3.0deg, group: slope, terrain: {kind: slope, deg: 3.0}}
  - {name: pyramid_5.0deg, group: slope, terrain: {kind: slope, deg: 5.0}}
  - {name: pyramid_7.0deg, group: slope, terrain: {kind: slope, deg: 7.0}}
  - {name: pyramid_9.0deg, group: slope, terrain: {kind: slope, deg: 9.0}}
  - {name: face_0deg_downhill, group: slope, terrain: {kind: face_slope, deg: 0, direction: downhill}}
  - {name: face_0deg_uphill, group: slope, terrain: {kind: face_slope, deg: 0, direction: uphill}}
  - {name: face_2.5deg_downhill, group: slope, terrain: {kind: face_slope, deg: 2.5, direction: downhill}}
  - {name: face_2.5deg_uphill, group: slope, terrain: {kind: face_slope, deg: 2.5, direction: uphill}}
  - {name: face_5deg_downhill, group: slope, terrain: {kind: face_slope, deg: 5, direction: downhill}}
  - {name: face_5deg_uphill, group: slope, terrain: {kind: face_slope, deg: 5, direction: uphill}}
  - {name: face_7.5deg_downhill, group: slope, terrain: {kind: face_slope, deg: 7.5, direction: downhill}}
  - {name: face_7.5deg_uphill, group: slope, terrain: {kind: face_slope, deg: 7.5, direction: uphill}}
  - {name: face_10deg_downhill, group: slope, terrain: {kind: face_slope, deg: 10, direction: downhill}}
  - {name: face_10deg_uphill, group: slope, terrain: {kind: face_slope, deg: 10, direction: uphill}}
  - {name: face_12.5deg_downhill, group: slope, terrain: {kind: face_slope, deg: 12.5, direction: downhill}}
  - {name: face_12.5deg_uphill, group: slope, terrain: {kind: face_slope, deg: 12.5, direction: uphill}}
  - {name: face_15deg_downhill, group: slope, terrain: {kind: face_slope, deg: 15, direction: downhill}}
  - {name: face_15deg_uphill, group: slope, terrain: {kind: face_slope, deg: 15, direction: uphill}}

  # --- Slippery floor: same friction on the feet AND the floor (training minimum 0.7)
  - {name: friction_0.6, group: friction, terrain: {kind: flat}, friction: 0.6}
  - {name: friction_0.5, group: friction, terrain: {kind: flat}, friction: 0.5}
  - {name: friction_0.4, group: friction, terrain: {kind: flat}, friction: 0.4}
  - {name: friction_0.3, group: friction, terrain: {kind: flat}, friction: 0.3}
  - {name: friction_0.2, group: friction, terrain: {kind: flat}, friction: 0.2}
  - {name: friction_0.1, group: friction, terrain: {kind: flat}, friction: 0.1}

  # --- Payload: on the centre of mass, or offset from it (x fwd, y left, z up, trunk frame)
  - {name: payload_10pct_com, group: payload, terrain: {kind: flat}, payload: {mass_frac: 0.1, offset_m: [0, 0, 0]}}
  - {name: payload_20pct_com, group: payload, terrain: {kind: flat}, payload: {mass_frac: 0.2, offset_m: [0, 0, 0]}}
  - {name: payload_30pct_com, group: payload, terrain: {kind: flat}, payload: {mass_frac: 0.3, offset_m: [0, 0, 0]}}
  - {name: payload_20pct_front, group: payload, terrain: {kind: flat}, payload: {mass_frac: 0.2, offset_m: [0.05, 0, 0]}}
  - {name: payload_20pct_back, group: payload, terrain: {kind: flat}, payload: {mass_frac: 0.2, offset_m: [-0.05, 0, 0]}}
  - {name: payload_20pct_side, group: payload, terrain: {kind: flat}, payload: {mass_frac: 0.2, offset_m: [0, 0.05, 0]}}
  - {name: payload_20pct_up, group: payload, terrain: {kind: flat}, payload: {mass_frac: 0.2, offset_m: [0, 0, 0.08]}}
  - {name: payload_30pct_front, group: payload, terrain: {kind: flat}, payload: {mass_frac: 0.3, offset_m: [0.05, 0, 0]}}
  - {name: payload_30pct_back, group: payload, terrain: {kind: flat}, payload: {mass_frac: 0.3, offset_m: [-0.05, 0, 0]}}
  - {name: payload_30pct_side, group: payload, terrain: {kind: flat}, payload: {mass_frac: 0.3, offset_m: [0, 0.05, 0]}}
  - {name: payload_30pct_up, group: payload, terrain: {kind: flat}, payload: {mass_frac: 0.3, offset_m: [0, 0, 0.08]}}

  # --- Transitions during the episode: terrain profile, friction drop, payload appearing
  - {name: trans_down_5deg, group: transition, terrain: {kind: strip, segments: [[1.5, 0], [1.5, -5], [4.0, 0]]}, episode_s: 30.0}
  - {name: trans_up_5deg, group: transition, terrain: {kind: strip, segments: [[1.5, 0], [1.5, 5], [4.0, 0]]}, episode_s: 30.0}
  - {name: trans_down_10deg, group: transition, terrain: {kind: strip, segments: [[1.5, 0], [1.5, -10], [4.0, 0]]}, episode_s: 30.0}
  - {name: trans_up_10deg, group: transition, terrain: {kind: strip, segments: [[1.5, 0], [1.5, 10], [4.0, 0]]}, episode_s: 30.0}
  - {name: trans_friction_0.3, group: transition, terrain: {kind: flat}, event: {type: friction, t_s: 5.0, value: 0.3}}
  - {name: trans_friction_0.15, group: transition, terrain: {kind: flat}, event: {type: friction, t_s: 5.0, value: 0.15}}
  - {name: trans_payload_30pct_com, group: transition, terrain: {kind: flat}, payload: {mass_frac: 0.3, offset_m: [0, 0, 0]}, event: {type: payload, t_s: 5.0}}
  - {name: trans_payload_30pct_back, group: transition, terrain: {kind: flat}, payload: {mass_frac: 0.3, offset_m: [-0.05, 0, 0]}, event: {type: payload, t_s: 5.0}}

# Groups of situations evaluated together. `all` is built in (every entry above, in order).
# A suite is a list of names, or {groups: [...]} for every situation of those groups.
suites:
  flat: [flat]
  fixed: {groups: [reference, uneven, steps, slope, friction, payload]}
  transitions: {groups: [transition]}
