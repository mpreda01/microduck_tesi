# Training (REPO_STRUCTURE.md, section 3).
#
# ---- ppo: the specialist policies of phase 2 (scripts/train.py ppo --situation <family>) ----
# Each specialist is alpha_walking fine-tuned with PPO on one family of situations, starting from its training
# checkpoint: actor, critic, observation normalizers, action std and optimizer state as Pollen left them.
# The environment is microduck_rl's hostile-terrain walking task (its reward, fine-tune mode, ladder
# promotion) with the terrain ladder of the family.
ppo:
  init_controller: alpha_walking   # configs/policies.yaml: its `checkpoint` is the start, its ONNX the check
  num_envs: 4096
  seed: 0
  wandb:                           # logging of the training runs; the tensorboard files are written in the run anyway
    enabled: true                  # false = tensorboard only
    project: microduck_thesis
    entity: null                   # W&B user or team; null = your default entity
    group: phase2_specialists      # groups the runs in the W&B interface
    tags: [phase2]                 # the family (e.g. slope_down) is added as a tag
    mode: online                   # online | offline (then `wandb sync <run folder>/wandb/offline-run-*`)
    upload_model: true             # upload the checkpoints (.pt) and their ONNX to W&B
  huggingface:                     # upload of the trained specialist to the model repo <namespace>/<family>-<YYYYMMDD-HHMM>,
    upload: true                   # the timestamp of the run folder, which is also the name of the W&B run
    namespace: mpreda                # Hugging Face user or organization; null = the logged-in user
    private: false
  save_interval: 100               # checkpoint (model_<it>.pt) every N iterations; the latest also as ONNX
  reward: {feet: false, track: false, progress: true}   # options of microduck_rl's hostile task:
                                   # feet = 3.5 cm foot swing, track = stricter speed tracking,
                                   # progress = anti-circling (promotion needs real displacement)
  finetune:                        # PPO on actor and critic together
    iterations: 1000
    learning_rate: 1.0e-4
    schedule: adaptive             # adaptive | fixed
    desired_kl: 0.01
    entropy_coef: 0.0              # > 0 pushes the action std up, i.e. away from alpha_walking
  command:                         # as the evaluation (eval.yaml): walk straight along the slope, never stand or turn
    lin_vel_x_m_s: [0.2, 0.4]      # forward speed, drawn again every 3-8 s (microduck_rl's resampling); no lateral.
                                   # Around eval.yaml's 0.3; at 0.10-0.12 alpha_walking stands still (2026-10-27)
    heading_jitter_deg: 5.0        # start heading +- this around the walking direction of the family
    heading_stiffness: 1.0         # yaw-rate command = clip(k x heading error, +-max_yaw_rate), as heading_hold
    max_yaw_rate_rad_s: 1.0
  # patch_size_m: a face of a face_slope pyramid is patch/2 - 0.5 m long, more than the 8 m walked in 20 s at
  # 0.4 m/s, so an episode stays on its face. start_margin_m: the start is this far from the top platform
  # (downhill) or from the patch edge (uphill), on the centre line of the +x face.
  terrain: {patch_size_m: 20.0, border_width_m: 4.0, ladder_rows: 8, flat_proportion: 0.15, start_margin_m: 0.5}
  # Which checkpoints to evaluate after a training (scripts/choose_checkpoint.py, Notes.txt). On the plateau: the whole
  # ladder reached and a fall share at most max_fall_pct_above_best points above the best checkpoint. Loose on
  # purpose: the training falls average all the ladder rows, and for slope_down they kept falling after it400
  # while the evaluation at 10 deg got worse. The checkpoint closest to init_controller on the plateau goes first.
  checkpoint_choice:
    window_iterations: 101         # curves averaged over this centred window around each checkpoint
    max_fall_pct_above_best: 2.0   # % of the episodes ended in a fall
    state_stride: 10               # distance from init_controller on every Nth recorded step

  # One specialist per family. Each terrain uses the keys of configs/situations.yaml; a value written as
  # [easy, hard] grows linearly along the ladder rows (difficulty 0 -> 1). On face_slope, `direction` sets
  # where the robot starts and the heading it keeps: downhill = from the top towards +x, uphill = from the
  # +x edge towards the top. All the terrains of a family share one direction.
  families:
    slope_down:
      - {terrain: face_slope, deg: [2.0, 10.0], direction: downhill}
    slope_up:
      - {terrain: face_slope, deg: [2.0, 10.0], direction: uphill}
