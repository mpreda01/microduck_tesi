[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steerduck"
version = "0.1.0"
description = "Steering vectors distilled from specialist policies for the Microduck's walking (master's thesis)"
requires-python = ">=3.12,<3.13"
# mujoco, mjlab (1.3.0) and bam (better-actuator-models) come from the environment of microduck_rl:
# the scripts run with `uv run --project external/microduck_rl --with-editable . python scripts/...`,
# so that the simulator is exactly the one of the policy cards (see README.md).
dependencies = [
    "numpy",
    "pyyaml",
    "pandas",
    "pyarrow",
    "scipy",
    "onnx",
    "onnxruntime",
    "torch",
    "huggingface_hub",
    "imageio[ffmpeg]",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["steerduck"]

[tool.ruff]
line-length = 120
